<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Finance Trash</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />


  <link rel="icon" href="{{ url_for('static', filename='img/ceylon-spice-haven-logo.webp') }}" type="image/webp" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/workspace.css') }}" />
  <script src="{{ url_for('static', filename='js/session.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/workspace.js') }}" defer></script>
</head>
<body class="app-body" data-app-role="{{ role }}">
  {% include "partials/app_navigation.html" %}
  <div class="topbar">
    <div>
      <h2>Finance — Deleted Records (Trash)</h2>
    </div>
    <div class="row">
      <a class="btn ghost" href="/dashboard">Overview</a>
      <span class="app-header-date" data-workspace-date></span>
    </div>
  </div>

  <div id="app-content" tabindex="-1" class="page" style="grid-template-columns: 1fr;">
    <div class="panel wide">

      <div class="block">
        <div class="row">
          <button class="btn ghost" id="refreshTrashBtn">Refresh</button>
          <button class="btn ghost" id="purgeBtn">Purge Expired (30 days)</button>
        </div>

        <p id="trashMsg" class="msg"></p>
      </div>

      <div class="hr"></div>

      <div class="tableWrap">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th><th>Type</th><th>Client</th><th>Category</th><th>Description</th>
              <th>Amount</th><th>Payment</th><th>Status</th>
              <th>Deleted At</th><th>Deleted By</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="trashBody"></tbody>
        </table>
      </div>

    </div>
  </div>

  <script src="{{ url_for('static', filename='js/admin_finance_trash.js') }}"></script>
</body>
</html>
