<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>{{file.name}}</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"/><link rel="stylesheet" href="{{url_for('static',filename='css/workspace.css')}}"/><script src="{{url_for('static',filename='js/session.js')}}" defer></script><script src="{{url_for('static',filename='js/workspace.js')}}" defer></script></head><body class="app-body" data-app-role="{{role}}">{%include 'partials/app_navigation.html'%}<div class="topbar"><h2>{{file.name}}</h2><a class="btn ghost" href="/document-storage">Documents</a></div><main id="app-content" tabindex="-1" class="page" style="grid-template-columns:minmax(0,1fr)"><section class="panel"><p>Private ERP folder. Files still awaiting a verified copy open their Drive original.</p><div class="tableWrap"><table class="table"><thead><tr><th>Name</th><th>Status</th><th>Open</th></tr></thead><tbody>{% for child in children %}<tr><td>{{child.name or 'File awaiting scan'}}</td><td>{{child.status}}</td><td><a class="btn ghost mini" href="{{url_for('object_storage.open_file',file_id=child.id)}}">Open</a></td></tr>{%endfor%}</tbody></table></div></section></main></body></html>
